<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Iso Sandbox · Infinite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #050810; font-family: 'IBM Plex Mono', ui-monospace, monospace; color: #e6e9ef; }
  canvas { display: block; touch-action: none; }
  .hud { position: fixed; inset: 0; pointer-events: none; }

  .menu-toggle {
    pointer-events: auto;
    position: absolute; top: max(14px, env(safe-area-inset-top)); right: 14px;
    width: 38px; height: 38px;
    background: rgba(10, 13, 18, 0.68); color: #c8d3e2;
    border: 1px solid rgba(120, 160, 200, 0.22);
    border-radius: 50%;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    font: inherit; font-size: 18px; line-height: 1; letter-spacing: 2px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .menu-toggle .saved {
    position: absolute; top: 7px; right: 7px;
    width: 5px; height: 5px; border-radius: 50%;
    background: #6ab880; opacity: 0; transition: opacity 0.25s;
  }
  .menu-toggle .saved.show { opacity: 1; }

  .menu {
    pointer-events: auto;
    position: absolute;
    top: calc(max(14px, env(safe-area-inset-top)) + 46px); right: 14px;
    min-width: 220px;
    background: rgba(10, 13, 18, 0.82);
    border: 1px solid rgba(120, 160, 200, 0.22);
    border-radius: 14px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: 12px 14px;
    display: flex; flex-direction: column; gap: 6px;
    font-size: 11px; letter-spacing: 0.04em; color: #c8d3e2;
  }
  .menu[hidden] { display: none; }
  .menu .kv { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; min-height: 22px; }
  .menu .lbl { color: #6e8aab; text-transform: uppercase; letter-spacing: 0.18em; font-size: 10px; }
  .menu .val { color: #c8d3e2; }
  .menu .val .dim { color: #6e8aab; margin-left: 4px; }
  .menu .link {
    pointer-events: auto; background: none; border: none; padding: 0;
    color: #9ecbff; font: inherit; cursor: pointer;
    text-decoration: underline; text-decoration-color: rgba(158, 203, 255, 0.32);
    text-underline-offset: 3px;
  }
  .menu .link.warn { color: #e08a8a; text-decoration-color: rgba(224, 138, 138, 0.32); }
  .menu .link.active { color: #ffd080; text-decoration-color: rgba(255, 208, 128, 0.4); }

  .dock {
    pointer-events: auto;
    position: absolute;
    left: 50%; bottom: max(20px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 2px;
    padding: 6px 8px;
    background: rgba(10, 13, 18, 0.68);
    border: 1px solid rgba(120, 160, 200, 0.22);
    border-radius: 999px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  /* icon-only by default (mobile) */
  .dock .tool {
    pointer-events: auto;
    width: 40px; height: 40px;
    background: transparent; border: 1px solid transparent; border-radius: 999px;
    color: #8a9bb0; font: inherit; font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 0;
  }
  .dock .tool .lbl { display: none; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; }
  .dock .tool.active { color: #9ecbff; border-color: rgba(158, 203, 255, 0.4); background: rgba(40, 70, 110, 0.4); }
  .dock .sep { width: 1px; height: 22px; background: rgba(120, 160, 200, 0.22); margin: 0 4px; }
  .dock .mat {
    pointer-events: auto;
    width: 36px; height: 40px; padding: 0;
    background: transparent; border: 1px solid transparent; border-radius: 999px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: border-color 0.15s, background 0.15s;
  }
  .dock .mat::before {
    content: ''; width: 14px; height: 14px; border-radius: 50%;
    background: var(--mat); opacity: 0.6; transition: opacity 0.15s;
  }
  .dock .mat.active { border-color: rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.06); }
  .dock .mat.active::before { opacity: 1; }
  /* decor slot */
  .dock .decor-slot { position: relative; display: flex; align-items: center; }
  .dock .decor-btn {
    pointer-events: auto;
    width: 40px; height: 40px;
    background: transparent; border: 1px solid transparent; border-radius: 999px;
    color: #8a9bb0; font: inherit; font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 0;
  }
  .dock .decor-btn .lbl { display: none; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; }
  .dock .decor-btn.active { color: #ffd080; border-color: rgba(255, 208, 128, 0.4); background: rgba(110, 80, 40, 0.4); }
  .dock .decor-chevron {
    pointer-events: auto;
    width: 18px; height: 40px; padding: 0; margin-left: -4px;
    background: transparent; border: none; color: #6e8aab;
    font: inherit; font-size: 10px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .decor-picker {
    pointer-events: auto;
    position: absolute; bottom: calc(100% + 10px); left: 50%;
    transform: translateX(-50%);
    background: rgba(10, 13, 18, 0.9);
    border: 1px solid rgba(120, 160, 200, 0.22); border-radius: 14px;
    padding: 8px; min-width: 150px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .decor-picker[hidden] { display: none; }
  .decor-picker .dpick {
    pointer-events: auto;
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px; border-radius: 8px;
    background: transparent; border: none;
    color: #c8d3e2; font: inherit; font-size: 11px;
    letter-spacing: 0.06em; text-transform: uppercase;
    cursor: pointer; text-align: left; width: 100%;
  }
  .decor-picker .dpick:hover, .decor-picker .dpick.active { background: rgba(255, 255, 255, 0.08); }
  .decor-picker .dpick .di { font-size: 14px; width: 18px; text-align: center; flex-shrink: 0; }
  /* labels on desktop */
  @media (min-width: 640px) {
    .dock .tool { width: auto; padding: 0 12px; gap: 6px; }
    .dock .tool .lbl { display: inline; }
    .dock .decor-btn { width: auto; padding: 0 12px; gap: 6px; }
    .dock .decor-btn .lbl { display: inline; }
    .dock .decor-chevron { margin-left: -8px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <button class="menu-toggle" id="menuToggle" aria-label="menu" aria-expanded="false">
    <span class="saved" id="savedDot"></span>
    <span id="menuIcon">⋯</span>
  </button>
  <div class="menu" id="menu" hidden>
    <div class="kv"><span class="lbl">time</span><span class="val"><span id="time">--:--</span><span class="dim" id="phase">—</span></span></div>
    <div class="kv"><span class="lbl">gps</span><span class="val" id="gpsRow">—</span></div>
    <div class="kv"><span class="lbl">view</span><span class="val" id="viewRow">—</span></div>
    <div class="kv"><span class="lbl">zoom</span><button class="link" id="zoomBtn">1x</button></div>
    <div class="kv"><span class="lbl">travel</span><button class="link" id="travelBtn">→ Tokyo</button></div>
    <div class="kv"><span class="lbl">spawn</span><button class="link" id="hereBtn">↻ Here</button></div>
    <div class="kv"><span class="lbl">demo</span><button class="link" id="demoBtn">play</button></div>
    <div class="kv"><span class="lbl">reset</span><button class="link warn" id="resetBtn">clear near</button></div>
  </div>
  <div class="dock">
    <button class="tool active" data-tool="raise">▲<span class="lbl">raise</span></button>
    <button class="tool" data-tool="lower">▼<span class="lbl">lower</span></button>
    <button class="tool" data-tool="smooth">≈<span class="lbl">smooth</span></button>
    <span class="sep"></span>
    <button class="mat active" data-mat="grass" aria-label="grass" style="--mat:#80a445"></button>
    <button class="mat" data-mat="soil" aria-label="soil" style="--mat:#7f6244"></button>
    <button class="mat" data-mat="sand" aria-label="sand" style="--mat:#e4d09a"></button>
    <button class="mat" data-mat="stone" aria-label="stone" style="--mat:#848484"></button>
    <span class="sep"></span>
    <div class="decor-slot">
      <button class="decor-btn" id="decorBtn"><span id="decorIcon">✦</span><span class="lbl" id="decorName">light</span></button>
      <button class="decor-chevron" id="decorChevron" aria-label="more decorations">▾</button>
      <div class="decor-picker" id="decorPicker" hidden>
        <button class="dpick active" data-decor="lantern"><span class="di">✦</span>light</button>
      </div>
    </div>
  </div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const timeEl = document.getElementById('time');
const phaseEl = document.getElementById('phase');
const demoBtn = document.getElementById('demoBtn');
const zoomBtn = document.getElementById('zoomBtn');
const savedDot = document.getElementById('savedDot');
const gpsRow = document.getElementById('gpsRow');
const viewRow = document.getElementById('viewRow');
const travelBtn = document.getElementById('travelBtn');
const hereBtn = document.getElementById('hereBtn');
const resetBtn = document.getElementById('resetBtn');
const menuToggle = document.getElementById('menuToggle');
const menuEl = document.getElementById('menu');
const menuIcon = document.getElementById('menuIcon');
const decorBtn = document.getElementById('decorBtn');
const decorChevron = document.getElementById('decorChevron');
const decorPicker = document.getElementById('decorPicker');
const decorIcon = document.getElementById('decorIcon');
const decorName = document.getElementById('decorName');

// -- config --
const TW_BASE = 32, TH_BASE = 16, LIFT_BASE = 6;
const MAX_H = 6;
const RESET_RADIUS = 24;
const ZOOM_LEVELS = [0.5, 1];
const LIGHT_RADIUS = 2.4;
const LIGHT_RGB = [255, 200, 100];
const STORAGE_KEY = 'iso-sandbox-v5';
const TILE_SCALE = 1000;
const MATERIALS = ['grass', 'soil', 'sand', 'stone'];

const CITIES = [
  { name: 'Singapore', lat: 1.35, lon: 103.82 },
  { name: 'Tokyo',     lat: 35.68, lon: 139.69 },
  { name: 'Reykjavik', lat: 64.13, lon: -21.94 },
  { name: 'Bali',      lat: -8.34, lon: 115.09 },
  { name: 'Sydney',    lat: -33.87, lon: 151.21 },
  { name: 'New York',  lat: 40.71, lon: -74.01 },
];

let zoomIdx = 1;
let zoom = ZOOM_LEVELS[zoomIdx];
let TW = TW_BASE * zoom, TH = TH_BASE * zoom, LIFT = LIFT_BASE * zoom;

// -- state --
const world = new Map();
const lights = new Map();
let camX = 0, camY = 0;
let hoverI = null, hoverJ = null;
let tool = 'raise';
let currentDecor = 'lantern';
let homeI = 0, homeJ = 0;
let homeLat = null, homeLon = null;
let homeCityName = null;
let cityIdx = 0;
let material = 'grass';

// -- geo --
function latLonToTile(lat, lon) {
  return {
    i: Math.round((lon - lat) * TILE_SCALE / 2),
    j: Math.round(-(lon + lat) * TILE_SCALE / 2),
  };
}
function formatLat(lat) { return Math.abs(lat).toFixed(2) + '°' + (lat >= 0 ? 'N' : 'S'); }
function formatLon(lon) { return Math.abs(lon).toFixed(2) + '°' + (lon >= 0 ? 'E' : 'W'); }
function updateGeoDisplay() {
  const next = CITIES[(cityIdx + 1) % CITIES.length];
  travelBtn.textContent = '→ ' + next.name;
}

function updateGpsDisplay(lat, lon, label) {
  if (lat == null || lon == null) {
    gpsRow.textContent = label || '—';
    return;
  }
  gpsRow.textContent = `${formatLat(lat)} ${formatLon(lon)}`;
}

let gpsWatchId = null;
function startGpsWatch() {
  if (!navigator.geolocation) { updateGpsDisplay(null, null, 'unsupported'); return; }
  if (!window.isSecureContext) { updateGpsDisplay(null, null, 'insecure'); return; }
  updateGpsDisplay(null, null, '…');
  gpsWatchId = navigator.geolocation.watchPosition(
    pos => updateGpsDisplay(pos.coords.latitude, pos.coords.longitude),
    err => {
      const map = { 1: 'denied', 2: 'unavailable', 3: 'timeout' };
      updateGpsDisplay(null, null, map[err.code] || 'error');
    },
    { enableHighAccuracy: false, maximumAge: 30 * 1000, timeout: 20000 }
  );
}

// -- persistence --
let saveTimer = null;
let savedDotTimer = null;
function scheduleSave() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 400);
}
function save() {
  try {
    const data = {
      v: 5,
      home: [homeI, homeJ],
      geo: (homeLat != null && homeLon != null) ? [homeLat, homeLon] : null,
      cityName: homeCityName,
      cityIdx,
      world: [...world.entries()],
      lights: [...lights.keys()],
      cam: [camX, camY],
      zoom: zoomIdx,
      tool,
      material,
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    flashSaved();
  } catch (e) { console.warn('save failed', e); }
}
function flashSaved() {
  savedDot.classList.add('show');
  if (savedDotTimer) clearTimeout(savedDotTimer);
  savedDotTimer = setTimeout(() => savedDot.classList.remove('show'), 600);
}
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d.world || !Array.isArray(d.world)) return false;
    world.clear(); lights.clear();
    for (const [k, v] of d.world) world.set(k, v);
    if (Array.isArray(d.lights)) for (const k of d.lights) lights.set(k, true);
    if (Array.isArray(d.cam)) { camX = d.cam[0]; camY = d.cam[1]; }
    if (typeof d.zoom === 'number' && ZOOM_LEVELS[d.zoom] != null) {
      zoomIdx = d.zoom;
      zoom = ZOOM_LEVELS[zoomIdx];
      TW = TW_BASE * zoom; TH = TH_BASE * zoom; LIFT = LIFT_BASE * zoom;
      zoomBtn.textContent = zoom + 'x';
    }
    if (typeof d.tool === 'string') {
      tool = d.tool;
      updateToolUI();
    }
    if (typeof d.material === 'string' && MATERIALS.includes(d.material)) {
      material = d.material;
      document.querySelectorAll('.mat').forEach(c => {
        c.classList.toggle('active', c.dataset.mat === material);
      });
    }
    if (Array.isArray(d.home)) { homeI = d.home[0]; homeJ = d.home[1]; }
    if (Array.isArray(d.geo)) { homeLat = d.geo[0]; homeLon = d.geo[1]; }
    if (typeof d.cityName === 'string' || d.cityName === null) homeCityName = d.cityName;
    if (typeof d.cityIdx === 'number') cityIdx = d.cityIdx;
    return true;
  } catch (e) { console.warn('load failed', e); return false; }
}

// -- time keyframes --
const KEYS = [
  { t: 0,    sky1:'#050812', sky2:'#0a1428', tint:[0.30, 0.36, 0.58], stars:1.0 },
  { t: 4.5,  sky1:'#0a0d20', sky2:'#1a1830', tint:[0.42, 0.42, 0.62], stars:0.7 },
  { t: 6,    sky1:'#3a2540', sky2:'#d68a78', tint:[0.95, 0.82, 0.78], stars:0.15 },
  { t: 7.5,  sky1:'#5a6a8a', sky2:'#f0c898', tint:[1.10, 1.00, 0.90], stars:0 },
  { t: 9,    sky1:'#3a5a78', sky2:'#a8c8d8', tint:[1.05, 1.05, 1.02], stars:0 },
  { t: 13,   sky1:'#365478', sky2:'#7ab0d8', tint:[1.05, 1.05, 1.00], stars:0 },
  { t: 16,   sky1:'#4a5878', sky2:'#a8b8d0', tint:[1.05, 1.00, 0.95], stars:0 },
  { t: 18,   sky1:'#5a3a4a', sky2:'#f0a050', tint:[1.22, 0.94, 0.68], stars:0 },
  { t: 19,   sky1:'#2a1a3a', sky2:'#8a4a7a', tint:[0.85, 0.62, 0.85], stars:0.2 },
  { t: 20,   sky1:'#0a0d20', sky2:'#1a1830', tint:[0.48, 0.45, 0.65], stars:0.6 },
  { t: 22,   sky1:'#060914', sky2:'#0c1628', tint:[0.34, 0.38, 0.60], stars:0.9 },
  { t: 24,   sky1:'#050812', sky2:'#0a1428', tint:[0.30, 0.36, 0.58], stars:1.0 },
];

let demoMode = false;
let demoStart = 0;
const DEMO_SECONDS = 20;
function getHours() {
  if (demoMode) {
    const e = (performance.now() - demoStart) / 1000;
    return (e * 24 / DEMO_SECONDS) % 24;
  }
  const d = new Date();
  return d.getHours() + d.getMinutes()/60 + d.getSeconds()/3600;
}
function phaseName(h) {
  if (h < 5 || h >= 21) return 'night';
  if (h < 6.5) return 'predawn';
  if (h < 8.5) return 'dawn';
  if (h < 16.5) return 'day';
  if (h < 18.5) return 'golden';
  if (h < 19.8) return 'dusk';
  return 'night';
}

// -- color utils --
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [(n>>16)&255, (n>>8)&255, n&255]; }
const cl = v => Math.max(0, Math.min(255, Math.round(v)));
function rgb2hex(r, g, b) { return '#' + [cl(r),cl(g),cl(b)].map(v => v.toString(16).padStart(2,'0')).join(''); }
const lerp = (a, b, t) => a + (b - a) * t;
function lerpHex(c1, c2, t) {
  const a = hex2rgb(c1), b = hex2rgb(c2);
  return rgb2hex(lerp(a[0],b[0],t), lerp(a[1],b[1],t), lerp(a[2],b[2],t));
}
function tintHex(hex, [tr,tg,tb]) {
  const [r,g,b] = hex2rgb(hex);
  return rgb2hex(r*tr, g*tg, b*tb);
}
function tintRgba(r, g, b, a, [tr,tg,tb]) {
  return `rgba(${cl(r*tr)},${cl(g*tg)},${cl(b*tb)},${a})`;
}
function addLightHex(hex, inf) {
  if (!inf) return hex;
  const [r,g,b] = hex2rgb(hex);
  return rgb2hex(r + inf[0], g + inf[1], b + inf[2]);
}

function getLighting() {
  const h = getHours();
  let p = KEYS[0], n = KEYS[KEYS.length-1];
  for (let i = 0; i < KEYS.length - 1; i++) {
    if (h >= KEYS[i].t && h < KEYS[i+1].t) { p = KEYS[i]; n = KEYS[i+1]; break; }
  }
  const t = (n.t === p.t) ? 0 : (h - p.t) / (n.t - p.t);
  const tint = [
    lerp(p.tint[0], n.tint[0], t),
    lerp(p.tint[1], n.tint[1], t),
    lerp(p.tint[2], n.tint[2], t),
  ];
  const brightness = (tint[0] + tint[1] + tint[2]) / 3;
  const lightStrength = Math.min(1, Math.max(0, (1 - brightness) * 1.7));
  return {
    hours: h,
    skyTop: lerpHex(p.sky1, n.sky1, t),
    skyBottom: lerpHex(p.sky2, n.sky2, t),
    tint, stars: lerp(p.stars, n.stars, t), lightStrength,
  };
}

function computeInfluence(lightStrength) {
  const inf = new Map();
  if (lightStrength <= 0.01 || lights.size === 0) return inf;
  for (const lk of lights.keys()) {
    const lc = world.get(lk);
    if (!lc || lc.h <= 0) continue;
    const parts = lk.split(','); const li = +parts[0], lj = +parts[1];
    for (let di = -2; di <= 2; di++) {
      for (let dj = -2; dj <= 2; dj++) {
        const d = Math.hypot(di, dj);
        if (d > LIGHT_RADIUS) continue;
        const ti = li + di, tj = lj + dj;
        const intensity = Math.pow(1 - d/LIGHT_RADIUS, 1.6) * lightStrength;
        if (intensity < 0.02) continue;
        const k = ti + ',' + tj;
        const cur = inf.get(k);
        const add = [intensity * LIGHT_RGB[0] * 0.5,
                     intensity * LIGHT_RGB[1] * 0.5,
                     intensity * LIGHT_RGB[2] * 0.5];
        if (cur) { cur[0] += add[0]; cur[1] += add[1]; cur[2] += add[2]; }
        else inf.set(k, add);
      }
    }
  }
  return inf;
}

const STARS = [];
function genStars() {
  STARS.length = 0;
  const count = Math.min(120, Math.floor((window.innerWidth * window.innerHeight) / 5500));
  for (let i = 0; i < count; i++) {
    STARS.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight * 0.7,
      s: Math.random() * 1.5 + 0.4,
      tw: Math.random() * 1000,
    });
  }
}

let W = 0, H = 0;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  genStars();
  draw();
}
window.addEventListener('resize', resize);

function cycleZoom() {
  const newIdx = (zoomIdx + 1) % ZOOM_LEVELS.length;
  const newZoom = ZOOM_LEVELS[newIdx];
  const f = newZoom / zoom;
  zoomIdx = newIdx;
  zoom = newZoom;
  TW = TW_BASE * zoom;
  TH = TH_BASE * zoom;
  LIFT = LIFT_BASE * zoom;
  camX *= f;
  camY *= f;
  zoomBtn.textContent = zoom + 'x';
  draw();
  scheduleSave();
}

function screenToTile(sx, sy) {
  const x = sx - camX - W/2, y = sy - camY - H/2;
  const ic = (x/(TW/2) + y/(TH/2)) / 2;
  const jc = (y/(TH/2) - x/(TW/2)) / 2;
  return { i: Math.round(ic), j: Math.round(jc) };
}
function centerOnTile(i, j) {
  camX = -(i - j) * TW / 2;
  camY = -(i + j) * TH / 2;
}

function travelTo(city) {
  homeLat = city.lat; homeLon = city.lon; homeCityName = city.name;
  const t = latLonToTile(city.lat, city.lon);
  homeI = t.i; homeJ = t.j;
  centerOnTile(homeI, homeJ);
  updateGeoDisplay();
  draw();
  scheduleSave();
}

// -- draw --
const BASE = {
  waterFlat: '#2f5878',
  waterHover: '#4a7ba8',
};
const MAT_BASE = {
  grass: {
    top:   ['#6b9039','#759a3f','#80a445','#8aae4b','#94b850','#9ec055'],
    hover: '#b8d870',
    sideL: '#7a5a3d',
    sideD: '#5a3f2a',
  },
  soil: {
    top:   ['#6b4f30','#75583a','#7f6244','#896c4e','#937558','#9d7f62'],
    hover: '#c0966c',
    sideL: '#5a3f2a',
    sideD: '#3f2a18',
  },
  sand: {
    top:   ['#d8c080','#dec890','#e4d09a','#eadaa4','#f0e2ae','#f6eab8'],
    hover: '#fff0c8',
    sideL: '#b89860',
    sideD: '#8a7048',
  },
  stone: {
    top:   ['#6c6c6c','#787878','#848484','#909090','#9c9c9c','#a8a8a8'],
    hover: '#c8c8c8',
    sideL: '#454545',
    sideD: '#2e2e2e',
  },
};

function diamond(x, y, fill, stroke) {
  ctx.beginPath();
  ctx.moveTo(x, y - TH/2);
  ctx.lineTo(x + TW/2, y);
  ctx.lineTo(x, y + TH/2);
  ctx.lineTo(x - TW/2, y);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
}

let P = null;
let INF = null;
let L_GLOBAL = null;

let drawScheduled = false;
function scheduleDraw() {
  if (drawScheduled) return;
  drawScheduled = true;
  requestAnimationFrame(() => { drawScheduled = false; draw(); });
}

function drawCell(i, j) {
  const key = i + ',' + j;
  const cell = world.get(key);
  const h = cell ? cell.h : 0;
  const hovered = i === hoverI && j === hoverJ;
  const cx = (i - j) * TW/2 + camX + W/2;
  const baseY = (i + j) * TH/2 + camY + H/2;
  const topY = baseY - h * LIFT;
  const inf = INF.get(key);

  if (h === 0) {
    const base = hovered ? P.waterHover : P.waterFlat;
    diamond(cx, baseY, addLightHex(base, inf), P.waterStroke);
    return;
  }
  const mat = P.mats[cell.m] || P.mats.grass;
  const liftPx = h * LIFT;
  ctx.fillStyle = addLightHex(mat.sideL, inf);
  ctx.beginPath();
  ctx.moveTo(cx - TW/2, topY);
  ctx.lineTo(cx, topY + TH/2);
  ctx.lineTo(cx, topY + TH/2 + liftPx);
  ctx.lineTo(cx - TW/2, topY + liftPx);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = addLightHex(mat.sideD, inf);
  ctx.beginPath();
  ctx.moveTo(cx + TW/2, topY);
  ctx.lineTo(cx, topY + TH/2);
  ctx.lineTo(cx, topY + TH/2 + liftPx);
  ctx.lineTo(cx + TW/2, topY + liftPx);
  ctx.closePath();
  ctx.fill();
  const gi = Math.min(h - 1, mat.top.length - 1);
  const top = hovered ? mat.hover : mat.top[gi];
  diamond(cx, topY, addLightHex(top, inf), P.topStroke);

  if (lights.has(key)) drawLanternPost(cx, topY);
}

function drawLanternPost(cx, topY) {
  const postH = LIFT * 1.3;
  const postW = Math.max(1.2, LIFT * 0.13);
  const lampR = Math.max(1.8, LIFT * 0.22);
  ctx.fillStyle = '#2a1d12';
  ctx.fillRect(cx - postW/2, topY - postH, postW, postH);
  const lampY = topY - postH;
  const ls = L_GLOBAL.lightStrength;
  if (ls > 0.05) {
    ctx.fillStyle = `rgba(255,${cl(220 + 35 * ls)},${cl(140 + 60 * ls)},1)`;
    ctx.beginPath(); ctx.arc(cx, lampY, lampR, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.fillStyle = '#3a2a1a';
    ctx.beginPath(); ctx.arc(cx, lampY, lampR, 0, Math.PI*2); ctx.fill();
  }
}

function drawGlows() {
  const ls = L_GLOBAL.lightStrength;
  if (ls < 0.05) return;
  ctx.globalCompositeOperation = 'lighter';
  for (const lk of lights.keys()) {
    const lc = world.get(lk);
    const h = lc ? lc.h : 0;
    if (h <= 0) continue;
    const parts = lk.split(','); const i = +parts[0], j = +parts[1];
    const cx = (i - j) * TW/2 + camX + W/2;
    const baseY = (i + j) * TH/2 + camY + H/2;
    const topY = baseY - h * LIFT;
    const lampY = topY - LIFT * 1.3;
    const r = TW * 1.6;
    if (cx + r < 0 || cx - r > W || lampY + r < 0 || lampY - r > H) continue;
    const grad = ctx.createRadialGradient(cx, lampY, 0, cx, lampY, r);
    grad.addColorStop(0, `rgba(255,210,130,${0.35 * ls})`);
    grad.addColorStop(0.5, `rgba(255,180,90,${0.12 * ls})`);
    grad.addColorStop(1, 'rgba(255,180,90,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(cx, lampY, r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function draw() {
  const L = getLighting();
  L_GLOBAL = L;
  P = {
    waterFlat: tintHex(BASE.waterFlat, L.tint),
    waterHover: tintHex(BASE.waterHover, L.tint),
    waterStroke: tintRgba(140, 190, 220, 0.18, L.tint),
    topStroke: tintRgba(200, 220, 160, 0.22, L.tint),
    mats: {},
  };
  for (const m of MATERIALS) {
    const b = MAT_BASE[m];
    P.mats[m] = {
      top: b.top.map(c => tintHex(c, L.tint)),
      hover: tintHex(b.hover, L.tint),
      sideL: tintHex(b.sideL, L.tint),
      sideD: tintHex(b.sideD, L.tint),
    };
  }
  INF = computeInfluence(L.lightStrength);

  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, L.skyTop);
  g.addColorStop(1, L.skyBottom);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  if (L.stars > 0.02) {
    const now = performance.now();
    for (const s of STARS) {
      const tw = 0.7 + 0.3 * Math.sin((now / 900) + s.tw);
      ctx.fillStyle = `rgba(255,250,230,${L.stars * 0.85 * tw})`;
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }
  }

  ctx.fillStyle = P.waterFlat;
  ctx.fillRect(0, 0, W, H);

  if (zoom >= 1) {
    const offsX = camX + W/2;
    const offsY = camY + H/2;
    const slope = TH / TW;
    ctx.strokeStyle = P.waterStroke;
    ctx.lineWidth = 1;
    const jLo = Math.floor((TH/2 - offsY - (W - offsX) * slope) / TH);
    const jHi = Math.ceil((H - offsY + TH/2 + offsX * slope) / TH);
    ctx.beginPath();
    for (let j = jLo; j <= jHi; j++) {
      const base = offsY - TH/2 + j * TH;
      ctx.moveTo(0, base - offsX * slope);
      ctx.lineTo(W, base + (W - offsX) * slope);
    }
    ctx.stroke();
    const iLo = Math.floor((TH/2 - offsY - offsX * slope) / TH);
    const iHi = Math.ceil((H - offsY + TH/2 + (W - offsX) * slope) / TH);
    ctx.beginPath();
    for (let i = iLo; i <= iHi; i++) {
      const base = offsY - TH/2 + i * TH;
      ctx.moveTo(0, base + offsX * slope);
      ctx.lineTo(W, base - (W - offsX) * slope);
    }
    ctx.stroke();
  }

  const drawables = [];

  for (const [k, inf] of INF) {
    if (world.has(k)) continue;
    const ci = k.indexOf(',');
    const i = +k.slice(0, ci), j = +k.slice(ci + 1);
    const cx = (i - j) * TW/2 + camX + W/2;
    const baseY = (i + j) * TH/2 + camY + H/2;
    if (cx + TW < 0 || cx - TW > W || baseY + TH < 0 || baseY - TH > H) continue;
    drawables.push({ s: i + j, kind: 'wlit', i, j, inf });
  }

  const hk = (hoverI != null && hoverJ != null) ? (hoverI + ',' + hoverJ) : null;
  if (hk && !world.has(hk) && !INF.has(hk)) {
    const cx = (hoverI - hoverJ) * TW/2 + camX + W/2;
    const baseY = (hoverI + hoverJ) * TH/2 + camY + H/2;
    if (cx + TW >= 0 && cx - TW <= W && baseY + TH >= 0 && baseY - TH <= H) {
      drawables.push({ s: hoverI + hoverJ, kind: 'whover', i: hoverI, j: hoverJ });
    }
  }

  for (const [k, cell] of world) {
    const ci = k.indexOf(',');
    const i = +k.slice(0, ci), j = +k.slice(ci + 1);
    const cx = (i - j) * TW/2 + camX + W/2;
    const baseY = (i + j) * TH/2 + camY + H/2;
    const topY = baseY - cell.h * LIFT;
    if (cx + TW < 0 || cx - TW > W || baseY + TH < 0 || topY - TH > H) continue;
    drawables.push({ s: i + j, kind: 'cell', i, j });
  }

  drawables.sort((a, b) => a.s - b.s);
  for (const d of drawables) {
    if (d.kind === 'cell') {
      drawCell(d.i, d.j);
    } else if (d.kind === 'wlit') {
      const cx = (d.i - d.j) * TW/2 + camX + W/2;
      const baseY = (d.i + d.j) * TH/2 + camY + H/2;
      diamond(cx, baseY, addLightHex(P.waterFlat, d.inf), zoom >= 1 ? P.waterStroke : null);
    } else {
      const cx = (d.i - d.j) * TW/2 + camX + W/2;
      const baseY = (d.i + d.j) * TH/2 + camY + H/2;
      diamond(cx, baseY, P.waterHover, P.waterStroke);
    }
  }

  drawGlows();

  const tm = Math.floor(L.hours * 60);
  const hh = Math.floor(tm / 60).toString().padStart(2, '0');
  const mm = (tm % 60).toString().padStart(2, '0');
  timeEl.textContent = `${hh}:${mm}`;
  phaseEl.textContent = phaseName(L.hours);

  const lon = -2 * camX / (TW * TILE_SCALE);
  const lat = 2 * camY / (TH * TILE_SCALE);
  viewRow.textContent = `${formatLat(lat)} ${formatLon(lon)}`;
}

// -- tools --
function applyTool(i, j) {
  const k = i + ',' + j;
  const cur = world.get(k);
  let changed = false;
  if (tool === 'raise') {
    if (!cur) { world.set(k, { h: 1, m: material }); changed = true; }
    else if (cur.h < MAX_H) { world.set(k, { h: cur.h + 1, m: material }); changed = true; }
    else if (cur.m !== material) { world.set(k, { h: cur.h, m: material }); changed = true; }
  } else if (tool === 'lower') {
    if (cur && cur.h > 1) { world.set(k, { h: cur.h - 1, m: cur.m }); changed = true; }
    else if (cur && cur.h === 1) { world.delete(k); lights.delete(k); changed = true; }
  } else if (tool === 'smooth') {
    const neighbors = [[i-1,j],[i+1,j],[i,j-1],[i,j+1]];
    const heights = neighbors.map(([ni,nj]) => { const nc = world.get(ni+','+nj); return nc ? nc.h : 0; });
    const curH = cur ? cur.h : 0;
    const avg = Math.round(([curH,...heights].reduce((a,b)=>a+b,0)) / 5);
    if (avg !== curH) {
      if (avg <= 0) { if (cur) { world.delete(k); lights.delete(k); } }
      else world.set(k, { h: Math.min(avg, MAX_H), m: cur ? cur.m : material });
      changed = true;
    }
  } else if (tool === 'lantern') {
    if (cur && cur.h > 0) {
      if (lights.has(k)) lights.delete(k);
      else lights.set(k, true);
      changed = true;
    }
  }
  if (changed) { draw(); scheduleSave(); }
}

function resetNearCamera() {
  const center = screenToTile(W / 2, H / 2);
  for (const k of [...world.keys()]) {
    const [i, j] = k.split(',').map(Number);
    if (Math.abs(i - center.i) <= RESET_RADIUS && Math.abs(j - center.j) <= RESET_RADIUS) {
      world.delete(k); lights.delete(k);
    }
  }
  for (const k of [...lights.keys()]) {
    const [i, j] = k.split(',').map(Number);
    if (Math.abs(i - center.i) <= RESET_RADIUS && Math.abs(j - center.j) <= RESET_RADIUS) {
      lights.delete(k);
    }
  }
}

// -- input --
let mode = 'idle';
let tStartX, tStartY, tMoved, tPainted;
let panStartX, panStartY, panSCX, panSCY;
const midpoint = ts => ({ x:(ts[0].clientX+ts[1].clientX)/2, y:(ts[0].clientY+ts[1].clientY)/2 });

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length === 1 && mode === 'idle') {
    mode = 'tool';
    const t = e.touches[0];
    tStartX = t.clientX; tStartY = t.clientY;
    tMoved = false; tPainted = new Set();
    const tt = screenToTile(t.clientX, t.clientY);
    hoverI = tt.i; hoverJ = tt.j; draw();
  } else if (e.touches.length >= 2) {
    mode = 'pan';
    const m = midpoint(e.touches);
    panStartX = m.x; panStartY = m.y; panSCX = camX; panSCY = camY;
    hoverI = null; hoverJ = null; draw();
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (mode === 'tool' && e.touches.length === 1) {
    const t = e.touches[0];
    const dx = t.clientX - tStartX, dy = t.clientY - tStartY;
    if (!tMoved && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) tMoved = true;
    const tt = screenToTile(t.clientX, t.clientY);
    if (tMoved && tool !== 'lantern') {
      const k = tt.i + ',' + tt.j;
      if (!tPainted.has(k)) { tPainted.add(k); applyTool(tt.i, tt.j); }
    }
    if (tt.i !== hoverI || tt.j !== hoverJ) { hoverI = tt.i; hoverJ = tt.j; scheduleDraw(); }
  } else if (mode === 'pan' && e.touches.length >= 2) {
    const m = midpoint(e.touches);
    camX = panSCX + (m.x - panStartX);
    camY = panSCY + (m.y - panStartY);
    scheduleDraw();
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  const wasPan = mode === 'pan';
  if (mode === 'tool' && !tMoved && e.changedTouches.length > 0) {
    const t = e.changedTouches[0];
    const tt = screenToTile(t.clientX, t.clientY);
    applyTool(tt.i, tt.j);
  }
  if (e.touches.length === 0) {
    mode = 'idle'; hoverI = null; hoverJ = null; draw();
    if (wasPan) scheduleSave();
  } else mode = 'idle';
}, { passive: false });

let mDown = false, mMoved = false, mSX, mSY, mSCX, mSCY;
canvas.addEventListener('mousedown', e => {
  mDown = true; mMoved = false;
  mSX = e.clientX; mSY = e.clientY; mSCX = camX; mSCY = camY;
});
canvas.addEventListener('mousemove', e => {
  if (mDown) {
    const dx = e.clientX - mSX, dy = e.clientY - mSY;
    if (!mMoved && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) mMoved = true;
    if (mMoved) { camX = mSCX + dx; camY = mSCY + dy; }
  }
  const tt = screenToTile(e.clientX, e.clientY);
  if (tt.i !== hoverI || tt.j !== hoverJ) { hoverI = tt.i; hoverJ = tt.j; }
  scheduleDraw();
});
window.addEventListener('mouseup', e => {
  if (mDown && !mMoved) {
    const tt = screenToTile(e.clientX, e.clientY);
    applyTool(tt.i, tt.j);
  } else if (mDown && mMoved) {
    scheduleSave();
  }
  mDown = false;
});

// -- buttons --
function updateToolUI() {
  document.querySelectorAll('.tool').forEach(b => b.classList.toggle('active', b.dataset.tool === tool));
  decorBtn.classList.toggle('active', tool === currentDecor);
}

document.querySelectorAll('.tool').forEach(btn => {
  btn.addEventListener('click', () => {
    tool = btn.dataset.tool;
    updateToolUI();
    scheduleSave();
  });
});

decorBtn.addEventListener('click', () => {
  tool = currentDecor;
  updateToolUI();
  decorPicker.setAttribute('hidden', '');
  scheduleSave();
});

decorChevron.addEventListener('click', () => {
  decorPicker.toggleAttribute('hidden');
});

document.querySelectorAll('.dpick').forEach(btn => {
  btn.addEventListener('click', () => {
    currentDecor = btn.dataset.decor;
    tool = currentDecor;
    const decoMap = { lantern: { icon: '✦', name: 'light' } };
    const d = decoMap[currentDecor] || { icon: '?', name: currentDecor };
    decorIcon.textContent = d.icon;
    decorName.textContent = d.name;
    document.querySelectorAll('.dpick').forEach(b => b.classList.toggle('active', b.dataset.decor === currentDecor));
    updateToolUI();
    decorPicker.setAttribute('hidden', '');
    scheduleSave();
  });
});

document.querySelectorAll('.mat').forEach(chip => {
  chip.addEventListener('click', () => {
    material = chip.dataset.mat;
    document.querySelectorAll('.mat').forEach(c => {
      c.classList.toggle('active', c.dataset.mat === material);
    });
    scheduleSave();
  });
});

resetBtn.addEventListener('click', () => {
  if (!confirm('Clear tiles near current view? Builds elsewhere remain.')) return;
  resetNearCamera();
  draw(); scheduleSave();
});

document.addEventListener('pointerdown', e => {
  if (!decorPicker.hidden && !decorPicker.contains(e.target) && e.target !== decorChevron) {
    decorPicker.setAttribute('hidden', '');
  }
});

menuToggle.addEventListener('click', () => {
  const open = menuEl.hasAttribute('hidden');
  if (open) {
    menuEl.removeAttribute('hidden');
    menuIcon.textContent = '×';
    menuToggle.setAttribute('aria-expanded', 'true');
  } else {
    menuEl.setAttribute('hidden', '');
    menuIcon.textContent = '⋯';
    menuToggle.setAttribute('aria-expanded', 'false');
  }
});

zoomBtn.addEventListener('click', cycleZoom);

travelBtn.addEventListener('click', () => {
  cityIdx = (cityIdx + 1) % CITIES.length;
  travelTo(CITIES[cityIdx]);
});

hereBtn.addEventListener('click', async () => {
  const orig = hereBtn.textContent;
  hereBtn.textContent = '…';
  hereBtn.disabled = true;
  const res = await getCurrentPosition();
  hereBtn.disabled = false;
  if (res.error) {
    console.warn('geolocation:', res.error, res.detail || '');
    hereBtn.textContent = res.error;
    setTimeout(() => { hereBtn.textContent = orig; }, 1800);
    return;
  }
  hereBtn.textContent = orig;
  cityIdx = -1;
  travelTo({ name: 'Here', lat: res.pos.coords.latitude, lon: res.pos.coords.longitude });
});

let demoRAF = null;
function demoTick() {
  draw();
  demoRAF = requestAnimationFrame(demoTick);
}
demoBtn.addEventListener('click', () => {
  demoMode = !demoMode;
  if (demoMode) {
    demoStart = performance.now();
    demoBtn.classList.add('active');
    demoBtn.textContent = 'stop';
    demoTick();
  } else {
    demoBtn.classList.remove('active');
    demoBtn.textContent = 'play';
    if (demoRAF) { cancelAnimationFrame(demoRAF); demoRAF = null; }
    draw();
  }
});

setInterval(() => { if (!demoMode) draw(); }, 10000);

function getCurrentPosition(opts = {}) {
  const { timeoutMs = 15000, maximumAge = 60 * 60 * 1000 } = opts;
  return new Promise(resolve => {
    if (!navigator.geolocation) { resolve({ error: 'unsupported' }); return; }
    if (!window.isSecureContext) { resolve({ error: 'insecure' }); return; }
    const guard = setTimeout(() => resolve({ error: 'timeout' }), timeoutMs + 500);
    navigator.geolocation.getCurrentPosition(
      pos => { clearTimeout(guard); resolve({ pos }); },
      err => {
        clearTimeout(guard);
        const map = { 1: 'denied', 2: 'unavailable', 3: 'timeout' };
        resolve({ error: map[err.code] || 'error', detail: err.message });
      },
      { enableHighAccuracy: false, maximumAge, timeout: timeoutMs }
    );
  });
}

// -- init --
(async function init() {
  const loaded = load();
  if (!loaded) {
    const res = await getCurrentPosition();
    if (res.pos) {
      homeLat = res.pos.coords.latitude;
      homeLon = res.pos.coords.longitude;
      homeCityName = 'Here';
      const t = latLonToTile(homeLat, homeLon);
      homeI = t.i; homeJ = t.j;
      cityIdx = -1;
    } else {
      cityIdx = 0;
      const c = CITIES[cityIdx];
      homeLat = c.lat; homeLon = c.lon; homeCityName = c.name;
      const t = latLonToTile(c.lat, c.lon);
      homeI = t.i; homeJ = t.j;
    }
    centerOnTile(homeI, homeJ);
    save();
  }
  updateGeoDisplay();
  startGpsWatch();
  resize();
})();
</script>
